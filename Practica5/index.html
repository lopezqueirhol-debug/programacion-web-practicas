<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de personajes</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="">
</head>
<body>
    <main class="contenedor">
        <h1>Rick and Morty Characters</h1>

        <input type="text" id="input-buscar" placeholder="Buscar Personajes...">
        <button id="btn-buscar">Buscar</button>

         <div id="mensaje" class="mensaje"></div>

        <section id="contenedor-tarjetas" class="tarjetas-grid"></section>

        <div id="paginacion" class="paginacion" style="display: none;">
            <button id="btn-anterior">Anterior</button>
            <span id="span-pagina">Pagina</span>
            <button id="btn-siguiente">Siguiente</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
